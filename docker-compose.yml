services:
  db:
    image: postgres:16-alpine
    container_name: conciliacao-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=conciliacao
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=conciliacao
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 127.0.0.1:5432 (nao 0.0.0.0): so alcancavel de dentro do proprio VPS,
    # nunca da internet - existe pra permitir tunel SSH (-L) de uma maquina
    # de fora (worker local do issnet, que precisa rodar numa rede que o
    # Cloudflare do portal nao bloqueie - ver rpa_worker.py WORKER_MODULOS).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-bancaria
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8501"

  api:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-api
    restart: unless-stopped
    # mesma imagem do app (ja tem todo o codigo via COPY . . no Dockerfile) -
    # so troca o entrypoint pra subir a API (api.py) em vez do Streamlit.
    # Existe pro script attended_worker/ sincronizar com o Hub so com
    # usuario/senha, sem precisar de chave SSH nem acesso direto ao
    # Postgres do VPS (ver api.py e attended_worker/hub_api.py).
    entrypoint: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    # a imagem tem um HEALTHCHECK proprio (curl na porta 8501, do
    # Streamlit) - nao existe nesse servico (so a 8000 aqui), o que
    # deixava o container sempre marcado "unhealthy" à toa.
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  rpa_worker:
    image: ghcr.io/redeg7/conciliacao-bancaria-worker:latest
    container_name: conciliacao-rpa-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # Muitos certificados A1 brasileiros usam algoritmo de criptografia
      # (RC2/3DES) que o OpenSSL 3.x (Node 24, bundlado no driver do
      # Playwright) desabilitou por padrao - sem isso, login por
      # certificado (issnet) falha com "Unsupported TLS certificate".
      - NODE_OPTIONS=--openssl-legacy-provider
      # issnet_rest_dms FICA DE FORA: o Cloudflare do portal ISS Net Online
      # bloqueia o IP de datacenter deste VPS mesmo com Chromium headed
      # (confirmado ao vivo) - esse modulo roda num worker local separado,
      # numa rede que o Cloudflare nao sinaliza (ver run-worker-issnet-local.ps1).
      # sefazgo_nfe (RPA NF GO): portal da SEFAZ-GO, sem Cloudflare
      # conhecido - roda no VPS; arquivos ficam no Hub (Baixar tudo .zip).
      - WORKER_MODULOS=issweb_rest_dms,sefazgo_nfe
    depends_on:
      db:
        condition: service_healthy
    # Sem expose/ports: so fala com o Postgres, nunca recebe HTTP.

  caddy:
    image: caddy:2-alpine
    container_name: conciliacao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
