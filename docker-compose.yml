services:
  db:
    image: postgres:16-alpine
    container_name: conciliacao-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=conciliacao
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=conciliacao
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-bancaria
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8501"

  caddy:
    image: caddy:2-alpine
    container_name: conciliacao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
