services:
  db:
    image: postgres:16-alpine
    container_name: conciliacao-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=conciliacao
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=conciliacao
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 127.0.0.1:5432 (nao 0.0.0.0): so alcancavel de dentro do proprio VPS,
    # nunca da internet - existe pra permitir tunel SSH (-L) de uma maquina
    # de fora (worker local do issnet, que precisa rodar numa rede que o
    # Cloudflare do portal nao bloqueie - ver rpa_worker.py WORKER_MODULOS).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-bancaria
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # endereco do CRM de Marketing - o card dele na home do Hub abre
      # esse link (o CRM tem login proprio, nao embute no Hub)
      - DOMINIO_MARKETING=${DOMINIO_MARKETING:-mkt.redeg7.com}
      # Honorarios Control (repo RedeG7/honorariocontrol, em /opt/honorarios)
      # - o card dele na home passa por /api/sso/honorarios (api.py)
      - DOMINIO_HONORARIOS=${DOMINIO_HONORARIOS:-honorarioscontrol.com.br}
      # Simulador INSS Obras (pasta inss-obras/) - o card dele na home passa
      # por /api/sso/inssobras (api.py)
      - DOMINIO_INSSOBRAS=${DOMINIO_INSSOBRAS:-inssobras.redeg7.com}
      # RH (pasta rh/) - o card dele na home passa por /api/sso/rh (api.py)
      - DOMINIO_RH=${DOMINIO_RH:-rh.redeg7.com}
      # WhatsApp Disparos (pasta whatsapp/) - o card dele na home passa por
      # /api/sso/whatsapp (api.py)
      - DOMINIO_WHATSAPP=${DOMINIO_WHATSAPP:-autoenviopro.com.br}
      # Calculadora RTC - Regime Regular (servico calculadora-rtc abaixo, so
      # na rede interna) - usada pela tela do RPA Fiscal (calculadora_rtc.py)
      - CALCULADORA_RTC_URL=http://calculadora-rtc:8080/api/calculadora
      # Calculadora RTC - Simples Nacional (servico calculadora-rtc-sn abaixo)
      - CALCULADORA_RTC_SN_URL=http://calculadora-rtc-sn:8082/api
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8501"

  api:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-api
    restart: unless-stopped
    # mesma imagem do app (ja tem todo o codigo via COPY . . no Dockerfile) -
    # so troca o entrypoint pra subir a API (api.py) em vez do Streamlit.
    # Existe pro script attended_worker/ sincronizar com o Hub so com
    # usuario/senha, sem precisar de chave SSH nem acesso direto ao
    # Postgres do VPS (ver api.py e attended_worker/hub_api.py).
    entrypoint: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    # a imagem tem um HEALTHCHECK proprio (curl na porta 8501, do
    # Streamlit) - nao existe nesse servico (so a 8000 aqui), o que
    # deixava o container sempre marcado "unhealthy" à toa.
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # login unico no CRM de Marketing (/api/sso/marketing em api.py) -
      # o segredo e gerado sozinho no .env pelo deploy (deploy.yml)
      - DOMINIO_MARKETING=${DOMINIO_MARKETING:-mkt.redeg7.com}
      - MARKETING_SSO_SECRET=${MARKETING_SSO_SECRET:-}
      # login unico no Honorarios Control (/api/sso/honorarios) - o segredo
      # e gerado no .env pelo deploy do repo honorariocontrol (mesmo VPS)
      - DOMINIO_HONORARIOS=${DOMINIO_HONORARIOS:-honorarioscontrol.com.br}
      - HONORARIOS_SSO_SECRET=${HONORARIOS_SSO_SECRET:-}
      # login unico no Simulador INSS Obras (/api/sso/inssobras) - o segredo
      # e gerado sozinho no .env pelo deploy (deploy.yml)
      - DOMINIO_INSSOBRAS=${DOMINIO_INSSOBRAS:-inssobras.redeg7.com}
      - INSSOBRAS_SSO_SECRET=${INSSOBRAS_SSO_SECRET:-}
      # login unico no RH (/api/sso/rh) - o segredo e gerado sozinho no .env
      # pelo deploy (deploy.yml)
      - DOMINIO_RH=${DOMINIO_RH:-rh.redeg7.com}
      - RH_SSO_SECRET=${RH_SSO_SECRET:-}
      # login unico no WhatsApp Disparos (/api/sso/whatsapp) - o segredo e
      # gerado sozinho no .env pelo deploy (deploy.yml)
      - DOMINIO_WHATSAPP=${DOMINIO_WHATSAPP:-autoenviopro.com.br}
      - WHATSAPP_SSO_SECRET=${WHATSAPP_SSO_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  rpa_worker:
    image: ghcr.io/redeg7/conciliacao-bancaria-worker:latest
    container_name: conciliacao-rpa-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # Muitos certificados A1 brasileiros usam algoritmo de criptografia
      # (RC2/3DES) que o OpenSSL 3.x (Node 24, bundlado no driver do
      # Playwright) desabilitou por padrao - sem isso, login por
      # certificado (issnet) falha com "Unsupported TLS certificate".
      - NODE_OPTIONS=--openssl-legacy-provider
      # issnet_rest_dms FICA DE FORA: o Cloudflare do portal ISS Net Online
      # bloqueia o IP de datacenter deste VPS mesmo com Chromium headed
      # (confirmado ao vivo) - esse modulo roda num worker local separado,
      # numa rede que o Cloudflare nao sinaliza (ver run-worker-issnet-local.ps1).
      # sefazgo_nfe (RPA NF GO) TAMBEM fica de fora: a consulta de notas da
      # SEFAZ-GO tem verificacao da Cloudflare que nao passa no navegador
      # do VPS (confirmado ao vivo) - roda no programa do PC do escritorio
      # (attended_worker/gui_nfgo.py), que pega a execucao pela API.
      - WORKER_MODULOS=issweb_rest_dms
    depends_on:
      db:
        condition: service_healthy
    # Sem expose/ports: so fala com o Postgres, nunca recebe HTTP.

  # Real 4U - Marketing & Comercial (CRM, pasta marketing/): app Node
  # separado, com banco proprio em SQLite (auth.db/real.db/demo.db) no
  # volume marketing_data - nao usa o Postgres nem o login do Hub. Fica
  # num subdominio proprio (DOMINIO_MARKETING) porque usa /api e /r na
  # raiz, que colidiriam com as rotas do Hub se fosse um caminho
  # (/marketing) no mesmo dominio.
  # Profile "marketing": so sobe com COMPOSE_PROFILES=marketing no .env do
  # VPS - assim o deploy do Hub nao quebra enquanto o pacote da imagem no
  # GHCR ainda nao esta publico / o DNS ainda nao existe (ver DEPLOY.md).
  marketing:
    image: ghcr.io/redeg7/real4u-marketing:latest
    profiles: ["marketing"]
    container_name: real4u-marketing
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - COOKIE_SECURE=1
      - TRUST_PROXY=1
      - FORM_WEBHOOK_TOKEN=${FORM_WEBHOOK_TOKEN:-}
      - FORM_DEFAULT_OWNER_ID=${FORM_DEFAULT_OWNER_ID:-}
      # escritorio (id no Hub) que recebe os leads do formulario quando o
      # site nao manda ?escritorio=... na URL do webhook
      - FORM_DEFAULT_OFFICE=${FORM_DEFAULT_OFFICE:-}
      # Google Ads: credenciais da PLATAFORMA (RedeG7, uma vez so - ver
      # DEPLOY.md); cada escritorio conecta a propria conta pela tela
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      - GOOGLE_ADS_CLIENT_ID=${GOOGLE_ADS_CLIENT_ID:-}
      - GOOGLE_ADS_CLIENT_SECRET=${GOOGLE_ADS_CLIENT_SECRET:-}
      - GOOGLE_ADS_LOGIN_CUSTOMER_ID=${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      # endereco publico do CRM (volta do login no Google)
      - MARKETING_PUBLIC_URL=https://${DOMINIO_MARKETING:-mkt.redeg7.com}
      # login unico vindo do Hub (marketing/src/sso.js) - mesmo segredo da api
      - SSO_SECRET=${MARKETING_SSO_SECRET:-}
      - HUB_URL=https://${DOMINIO}
    volumes:
      - marketing_data:/data
    expose:
      - "3000"

  # Simulador INSS Obras (pasta inss-obras/): app Node separado, com banco
  # proprio em SQLite (inssobras.db) no volume inssobras_data - dados
  # separados por escritorio do Hub, login so pelo card do Hub (SSO).
  # Profile "inssobras": o deploy liga sozinho quando a imagem ja pode ser
  # baixada do GHCR (mesma logica do Marketing, ver deploy.yml).
  inssobras:
    image: ghcr.io/redeg7/inss-obras:latest
    profiles: ["inssobras"]
    container_name: inss-obras
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - COOKIE_SECURE=1
      - TRUST_PROXY=1
      - PUBLIC_URL=https://${DOMINIO_INSSOBRAS:-inssobras.redeg7.com}
      - SSO_SECRET=${INSSOBRAS_SSO_SECRET:-}
      # cifra dos certificados A1 dos clientes (DCTF Web) - gerada uma vez
      # pelo deploy; perder a chave obriga a reenviar os certificados
      - CERT_ENC_KEY=${INSSOBRAS_CERT_KEY:-}
      - HUB_URL=https://${DOMINIO}
    volumes:
      - inssobras_data:/data
    expose:
      - "3000"

  # RH (pasta rh/): app Node separado, com banco proprio em SQLite (rh.db) no
  # volume rh_data - dados separados por escritorio do Hub, login so pelo card
  # do Hub (SSO). Profile "rh": o deploy liga sozinho quando a imagem ja pode
  # ser baixada do GHCR (mesma logica do Marketing, ver deploy.yml).
  rh:
    image: ghcr.io/redeg7/rh:latest
    profiles: ["rh"]
    container_name: rh
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - COOKIE_SECURE=1
      - TRUST_PROXY=1
      - PUBLIC_URL=https://${DOMINIO_RH:-rh.redeg7.com}
      - SSO_SECRET=${RH_SSO_SECRET:-}
      - HUB_URL=https://${DOMINIO}
    volumes:
      - rh_data:/data
    expose:
      - "3000"

  # WhatsApp Disparos (pasta whatsapp/, monorepo Node vindo do Replit): banco
  # proprio ("whatsapp") dentro do mesmo Postgres do Hub - criado sozinho pelo
  # container na primeira subida. A sessao do WhatsApp conectado (Baileys) e
  # as imagens dos modelos ficam no volume whatsapp_data: sem ele seria
  # preciso ler o QR Code de novo a cada deploy. Login pelo card do Hub (SSO)
  # ou usuario/senha proprios. Profile "whatsapp": o deploy liga sozinho
  # quando a imagem ja pode ser baixada (mesma logica do Marketing).
  whatsapp:
    image: ghcr.io/redeg7/whatsapp-disparos:latest
    profiles: ["whatsapp"]
    container_name: whatsapp-disparos
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/whatsapp
      - SESSION_SECRET=${WHATSAPP_SESSION_SECRET:-}
      - SSO_SECRET=${WHATSAPP_SSO_SECRET:-}
      # senha do primeiro super_admin ("admin"), criado so com o banco vazio
      - AUTH_PASSWORD=${WHATSAPP_ADMIN_PASSWORD:-}
      - COOKIE_SECURE=1
      - TRUST_PROXY=1
    volumes:
      - whatsapp_data:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  # Calculadora RTC - Regime Regular: a calculadora OFICIAL da Receita Federal
  # (API Java + banco SQLite das tabelas oficiais, montada por
  # calculadora-rtc/Dockerfile). A API nao tem login, entao fica SO na rede
  # interna: sem "ports" e sem rota no Caddy - so o Hub (app) fala com ela.
  # Nome com hifen (nao "_"): o Tomcat da API recusa Host com sublinhado.
  # Profile "calculadorartc": o deploy liga sozinho quando a imagem ja pode
  # ser baixada (mesma logica do Marketing, ver deploy.yml).
  calculadora-rtc:
    image: ghcr.io/redeg7/calculadora-rtc:latest
    profiles: ["calculadorartc"]
    container_name: calculadora-rtc
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m
    mem_limit: 768m
    expose:
      - "8080"

  # Calculadora RTC - Simples Nacional: a calculadora OFICIAL da Receita para
  # o Simples (calculadora-rtc-sn/Dockerfile), mesmas regras da de cima: sem
  # login, so na rede interna. Profile "calculadorartcsn", ligado pelo deploy
  # quando a imagem ja pode ser baixada.
  calculadora-rtc-sn:
    image: ghcr.io/redeg7/calculadora-rtc-sn:latest
    profiles: ["calculadorartcsn"]
    container_name: calculadora-rtc-sn
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m -XX:-UseBASE64Intrinsics
    mem_limit: 768m
    expose:
      - "8082"

  caddy:
    image: caddy:2-alpine
    container_name: conciliacao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
      # subdominio do CRM de Marketing (padrao mkt.redeg7.com; pode
      # ser trocado no .env) - precisa do registro DNS A apontando pro VPS
      - DOMINIO_MARKETING=${DOMINIO_MARKETING:-mkt.redeg7.com}
      # subdominio do Simulador INSS Obras (registro DNS A apontando pro VPS)
      - DOMINIO_INSSOBRAS=${DOMINIO_INSSOBRAS:-inssobras.redeg7.com}
      # subdominio do RH (registro DNS A apontando pro VPS)
      - DOMINIO_RH=${DOMINIO_RH:-rh.redeg7.com}
      # atalho para a tela de Admissoes do Hub (registro DNS A apontando pro VPS)
      - DOMINIO_ADMISSAO=${DOMINIO_ADMISSAO:-admissao.redeg7.com}
      # subdominio do WhatsApp Disparos (registro DNS A apontando pro VPS)
      - DOMINIO_WHATSAPP=${DOMINIO_WHATSAPP:-autoenviopro.com.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  marketing_data:
  inssobras_data:
  rh_data:
  whatsapp_data:
