services:
  db:
    image: postgres:16-alpine
    container_name: conciliacao-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=conciliacao
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=conciliacao
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-bancaria
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8501"

  rpa_worker:
    image: ghcr.io/redeg7/conciliacao-bancaria-worker:latest
    container_name: conciliacao-rpa-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # Muitos certificados A1 brasileiros usam algoritmo de criptografia
      # (RC2/3DES) que o OpenSSL 3.x (Node 24, bundlado no driver do
      # Playwright) desabilitou por padrao - sem isso, login por
      # certificado (issnet) falha com "Unsupported TLS certificate".
      - NODE_OPTIONS=--openssl-legacy-provider
    depends_on:
      db:
        condition: service_healthy
    # Sem expose/ports: so fala com o Postgres, nunca recebe HTTP.

  caddy:
    image: caddy:2-alpine
    container_name: conciliacao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
