services:
  db:
    image: postgres:16-alpine
    container_name: conciliacao-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=conciliacao
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=conciliacao
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 127.0.0.1:5432 (nao 0.0.0.0): so alcancavel de dentro do proprio VPS,
    # nunca da internet - existe pra permitir tunel SSH (-L) de uma maquina
    # de fora (worker local do issnet, que precisa rodar numa rede que o
    # Cloudflare do portal nao bloqueie - ver rpa_worker.py WORKER_MODULOS).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-bancaria
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # endereco do CRM de Marketing - o card dele na home do Hub abre
      # esse link (o CRM tem login proprio, nao embute no Hub)
      - DOMINIO_MARKETING=${DOMINIO_MARKETING:-mkt.redeg7.com}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8501"

  api:
    image: ghcr.io/redeg7/conciliacao-bancaria:latest
    container_name: conciliacao-api
    restart: unless-stopped
    # mesma imagem do app (ja tem todo o codigo via COPY . . no Dockerfile) -
    # so troca o entrypoint pra subir a API (api.py) em vez do Streamlit.
    # Existe pro script attended_worker/ sincronizar com o Hub so com
    # usuario/senha, sem precisar de chave SSH nem acesso direto ao
    # Postgres do VPS (ver api.py e attended_worker/hub_api.py).
    entrypoint: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    # a imagem tem um HEALTHCHECK proprio (curl na porta 8501, do
    # Streamlit) - nao existe nesse servico (so a 8000 aqui), o que
    # deixava o container sempre marcado "unhealthy" à toa.
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # login unico no CRM de Marketing (/api/sso/marketing em api.py) -
      # o segredo e gerado sozinho no .env pelo deploy (deploy.yml)
      - DOMINIO_MARKETING=${DOMINIO_MARKETING:-mkt.redeg7.com}
      - MARKETING_SSO_SECRET=${MARKETING_SSO_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  rpa_worker:
    image: ghcr.io/redeg7/conciliacao-bancaria-worker:latest
    container_name: conciliacao-rpa-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://conciliacao:${POSTGRES_PASSWORD}@db:5432/conciliacao
      - RPA_ENC_KEY=${RPA_ENC_KEY}
      # Muitos certificados A1 brasileiros usam algoritmo de criptografia
      # (RC2/3DES) que o OpenSSL 3.x (Node 24, bundlado no driver do
      # Playwright) desabilitou por padrao - sem isso, login por
      # certificado (issnet) falha com "Unsupported TLS certificate".
      - NODE_OPTIONS=--openssl-legacy-provider
      # issnet_rest_dms FICA DE FORA: o Cloudflare do portal ISS Net Online
      # bloqueia o IP de datacenter deste VPS mesmo com Chromium headed
      # (confirmado ao vivo) - esse modulo roda num worker local separado,
      # numa rede que o Cloudflare nao sinaliza (ver run-worker-issnet-local.ps1).
      # sefazgo_nfe (RPA NF GO) TAMBEM fica de fora: a consulta de notas da
      # SEFAZ-GO tem verificacao da Cloudflare que nao passa no navegador
      # do VPS (confirmado ao vivo) - roda no programa do PC do escritorio
      # (attended_worker/gui_nfgo.py), que pega a execucao pela API.
      - WORKER_MODULOS=issweb_rest_dms
    depends_on:
      db:
        condition: service_healthy
    # Sem expose/ports: so fala com o Postgres, nunca recebe HTTP.

  # Real 4U - Marketing & Comercial (CRM, pasta marketing/): app Node
  # separado, com banco proprio em SQLite (auth.db/real.db/demo.db) no
  # volume marketing_data - nao usa o Postgres nem o login do Hub. Fica
  # num subdominio proprio (DOMINIO_MARKETING) porque usa /api e /r na
  # raiz, que colidiriam com as rotas do Hub se fosse um caminho
  # (/marketing) no mesmo dominio.
  # Profile "marketing": so sobe com COMPOSE_PROFILES=marketing no .env do
  # VPS - assim o deploy do Hub nao quebra enquanto o pacote da imagem no
  # GHCR ainda nao esta publico / o DNS ainda nao existe (ver DEPLOY.md).
  marketing:
    image: ghcr.io/redeg7/real4u-marketing:latest
    profiles: ["marketing"]
    container_name: real4u-marketing
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - COOKIE_SECURE=1
      - TRUST_PROXY=1
      - FORM_WEBHOOK_TOKEN=${FORM_WEBHOOK_TOKEN:-}
      - FORM_DEFAULT_OWNER_ID=${FORM_DEFAULT_OWNER_ID:-}
      # escritorio (id no Hub) que recebe os leads do formulario quando o
      # site nao manda ?escritorio=... na URL do webhook
      - FORM_DEFAULT_OFFICE=${FORM_DEFAULT_OFFICE:-}
      # Google Ads: credenciais da PLATAFORMA (RedeG7, uma vez so - ver
      # DEPLOY.md); cada escritorio conecta a propria conta pela tela
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      - GOOGLE_ADS_CLIENT_ID=${GOOGLE_ADS_CLIENT_ID:-}
      - GOOGLE_ADS_CLIENT_SECRET=${GOOGLE_ADS_CLIENT_SECRET:-}
      - GOOGLE_ADS_LOGIN_CUSTOMER_ID=${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      # endereco publico do CRM (volta do login no Google)
      - MARKETING_PUBLIC_URL=https://${DOMINIO_MARKETING:-mkt.redeg7.com}
      # login unico vindo do Hub (marketing/src/sso.js) - mesmo segredo da api
      - SSO_SECRET=${MARKETING_SSO_SECRET:-}
      - HUB_URL=https://${DOMINIO}
    volumes:
      - marketing_data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: conciliacao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
      # subdominio do CRM de Marketing (padrao mkt.redeg7.com; pode
      # ser trocado no .env) - precisa do registro DNS A apontando pro VPS
      - DOMINIO_MARKETING=${DOMINIO_MARKETING:-mkt.redeg7.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  marketing_data:
