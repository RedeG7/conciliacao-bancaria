name: Build e Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  # programa do PC do RPA NF GO (attended_worker/gui_nfgo.py): o .exe so
  # pode ser montado no Windows; vai pra imagem da app, de onde o Hub
  # serve o download (/api/attended-nfgo/download). Se falhar, o deploy
  # segue sem o .exe (o Hub mostra que o download nao esta disponivel).
  build-nfgo-exe:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Montar nfgo_attended.exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywinauto requests pillow truststore openpyxl pyinstaller
          ./attended_worker/build_nfgo.ps1 -Python python

      - uses: actions/upload-artifact@v4
        with:
          name: nfgo-attended-exe
          path: attended_worker/dist/nfgo_attended.exe
          retention-days: 7

  build-and-push:
    needs: build-nfgo-exe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nfgo-attended-exe
          path: attended_worker/dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/redeg7/conciliacao-bancaria:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/redeg7/conciliacao-bancaria-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # CRM Real 4U - Marketing & Comercial (pasta marketing/, Node)
      - uses: docker/build-push-action@v5
        with:
          context: marketing
          push: true
          tags: ghcr.io/redeg7/real4u-marketing:latest
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # o token do job (GITHUB_TOKEN) e repassado ao VPS so pra baixar as
    # imagens do GHCR durante o deploy - assim os pacotes podem ficar
    # privados (o real4u-marketing nao precisa ser publico).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # copia docker-compose.yml e Caddyfile atualizados para o VPS (o
      # codigo da app em si vem pela imagem, nao precisa do repo inteiro la)
      - name: Copiar arquivos de deploy para o VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/conciliacao-bancaria"

      - name: Atualizar e reiniciar os containers no VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            cd /opt/conciliacao-bancaria
            # login no GHCR com o token deste job (expira quando o job
            # termina; o logout no fim tira ele do VPS) - permite baixar
            # imagens de pacotes privados.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # liga o CRM de Marketing (profile "marketing" do compose) no
            # .env - so quando a imagem dele ja pode ser baixada: antes
            # disso, ligar o profile faria o "compose pull/up" falhar e
            # derrubaria o deploy do Hub junto.
            if docker pull -q ghcr.io/redeg7/real4u-marketing:latest >/dev/null 2>&1; then
              if ! grep -q '^COMPOSE_PROFILES=' .env; then
                printf '\nCOMPOSE_PROFILES=marketing\n' >> .env
              elif ! grep -q '^COMPOSE_PROFILES=.*marketing' .env; then
                sed -i 's/^COMPOSE_PROFILES=\(.*\)$/COMPOSE_PROFILES=\1,marketing/' .env
              fi
            else
              echo "Imagem real4u-marketing nao acessivel - CRM de Marketing nao ligado"
            fi
            # segredo do login unico Hub -> CRM de Marketing (api.py e
            # marketing/src/sso.js): gerado uma vez e guardado no .env
            if ! grep -q '^MARKETING_SSO_SECRET=.' .env; then
              sed -i '/^MARKETING_SSO_SECRET=/d' .env
              printf '\nMARKETING_SSO_SECRET=%s\n' "$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> .env
            fi
            docker compose pull
            docker compose up -d
            # Caddyfile e bind mount - scp-action troca o arquivo via
            # rename (inode novo), entao o container ja rodando continua
            # com o bind mount preso ao inode ANTIGO (reload de dentro do
            # container le exatamente esse caminho preso, entao nem reload
            # resolve) - so um restart do container reestabelece o mount
            # contra o arquivo atual. Confirmado ao vivo: "docker exec
            # caddy cat Caddyfile" mostrava conteudo antigo mesmo depois
            # do host ja ter o novo.
            docker compose restart caddy
            docker image prune -f
            docker logout ghcr.io
